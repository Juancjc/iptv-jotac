name: Switch (.nro)

on:
  push:
    paths:
      - "switch/**"
      - ".gitmodules"
      - ".github/workflows/switch.yml"
  workflow_dispatch:

jobs:
  build-nro:
    runs-on: ubuntu-latest
    # Same image and portlibs as Switchfin's Switch build (dragonflylee/switchfin),
    # which the borealis fork used here comes from.
    container:
      image: devkitpro/devkita64:20260219
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install portlibs (curl, ffmpeg, libmpv)
        run: |
          for pkg in mbedtls-3.6.7-1 libssh2-1.11.1-1 dav1d-1.5.4-1 curl-8.21.0-3 ffmpeg-7.1.5-5 libmpv-0.36.0-5; do
            dkp-pacman --noconfirm -U $BASE_URL/switch-${pkg}-any.pkg.tar.zst
          done
          git config --system --add safe.directory '*'

      - name: Apply borealis patch
        run: git -C switch/library/borealis apply ../../patches/borealis-iptv.patch

      - name: Build nro
        run: |
          cmake -S switch -B switch/build -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
          make -C switch/build IptvJotac.nro -j$(nproc)

      - name: Upload nro
        uses: actions/upload-artifact@v4
        with:
          name: IptvJotac-switch-${{ github.run_number }}
          path: switch/build/IptvJotac.nro
